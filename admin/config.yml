backend:
  name: git-gateway
  branch: main # O master, según tu rama en GitHub

media_folder: "assets/uploads" # Dónde se guardarán las fotos subidas
public_folder: "/assets/uploads"

collections:
  - name: "comunidad"
    label: "Comunidad / Blog"
    folder: "contenido/comunidad"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título de la publicación", name: "title", widget: "string", default: "Resumen de entrenamientos semanales" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen destacada", name: "image", widget: "image", required: false }
      - { label: "Archivo de Video (Local)", name: "video_file", widget: "file", required: false }
      - { label: "Enlace de YouTube (URL)", name: "youtube_url", widget: "string", required: false, hint: "Ejemplo: https://www.youtube.com/watch?v=dQw4w9WgXcQ" }
      - { label: "Texto de la publicación", name: "body", widget: "markdown" }
